name: Rappel WhatsApp des trades en cours

on:
  schedule:
    - cron: "0 5 * * 1-5"   # TEST : 5h00 UTC, du lundi au vendredi (remettre "0 22 * * 1-5" après le test)
  workflow_dispatch:           # lancement manuel pour tester

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        working-directory: notifier
        run: npm install --omit=dev
      - name: Envoyer les rappels
        working-directory: notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          WA_LANG: fr
        run: node notify.js
